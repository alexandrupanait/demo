<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cosul de cumparaturi | RAL')}"></head>
<body id="ralonline">

<div th:replace="~{fragments/chrome :: header}"></div>

<div class="Content">
    <h1>Cosul de cumparaturi</h1>

    <table width="100%" cellpadding="6" cellspacing="0" border="0" style="font-size:12px;">
        <tr style="background:#eee; font-weight:bold; text-align:left;">
            <td>Produs</td>
            <td align="right">Pret unitar (cu TVA)</td>
            <td align="center">Cantitate</td>
            <td align="right">Subtotal (cu TVA)</td>
            <td></td>
        </tr>
        <tr th:each="linie : ${linii}" style="border-bottom:1px solid #ddd;">
            <td><a th:href="@{/produse/{id}(id=${linie.produs.id})}" th:text="${linie.produs.numeAfisat}"></a></td>
            <td align="right" th:text="|${linie.pretUnitarCuTva} RON|"></td>
            <td align="center">
                <form th:action="@{/cart/update}" method="post" style="display:inline">
                    <input type="hidden" name="produsId" th:value="${linie.produs.id}" />
                    <input type="number" name="cantitate" min="1" th:value="${linie.cantitate}" style="width:50px;" />
                    <input type="submit" value="actualizeaza" />
                </form>
            </td>
            <td align="right" th:text="|${linie.subtotalCuTva} RON|"></td>
            <td>
                <form th:action="@{/cart/remove}" method="post" style="display:inline">
                    <input type="hidden" name="produsId" th:value="${linie.produs.id}" />
                    <input type="submit" value="sterge" />
                </form>
            </td>
        </tr>
    </table>

    <p th:if="${#lists.isEmpty(linii)}">Cosul de cumparaturi este gol.</p>

    <h2 th:if="${!#lists.isEmpty(linii)}" style="text-align:right;" th:text="|Total (cu TVA): ${total} RON|"></h2>

    <p th:if="${!#lists.isEmpty(linii)}" style="text-align:right;">
        <a th:href="@{/ralonline/shopping_cart/checkout}">Finalizeaza comanda &raquo;</a>
    </p>

    <p><a th:href="@{/produse}">&laquo; Continua cumparaturile</a></p>
</div>

<div class="Clear"></div>

<div th:replace="~{fragments/chrome :: footer}"></div>

</body>
</html>
