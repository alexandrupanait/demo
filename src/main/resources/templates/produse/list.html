<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Produse | RAL')}"></head>
<body id="ProductList">

<div th:replace="~{fragments/chrome :: header}"></div>

<div class="Menu">
    <div th:replace="~{fragments/category-tree :: menu(${categoryTree}, ${selectedCategorie})}"></div>
</div>

<div class="Spacer"></div>

<div class="breadcrumb" th:if="${!#lists.isEmpty(breadcrumb)}">
    <div class="logo-block"><img alt="RAL" src="/images/logo/logo_no_background.png" />&nbsp;</div>
    <div class="secondary-block"><a th:href="@{/produse}">Produse</a></div>
    <div class="separator">&nbsp;&raquo;&nbsp;</div>
    <th:block th:each="cat, iter : ${breadcrumb}">
        <th:block th:if="${!iter.last}">
            <div class="secondary-block"><a th:href="@{/produse(categorie=${cat.id})}" th:text="${cat.nume}"></a></div>
            <div class="separator">&nbsp;&raquo;&nbsp;</div>
        </th:block>
        <div th:if="${iter.last}" class="primary-block" th:text="${cat.nume}"></div>
    </th:block>
</div>

<div class="ProductContent">
    <th:block th:each="produs : ${rezultat.produse}">
        <div th:replace="~{fragments/product-card :: card(${produs}, ${rezultat.pretPentru(produs.id)})}"></div>
    </th:block>
    <div style="clear:both;">&nbsp;</div>
    <p th:if="${#lists.isEmpty(rezultat.produse)}">Niciun produs nu corespunde filtrelor selectate.</p>
</div>

<div class="Spacer">&nbsp;</div>

<div class="Filters">
    <table width="160" border="0" cellspacing="0" cellpadding="0">
        <tr><td class="Header" align="left" valign="middle">Filtrare</td></tr>
        <tr><td class="Main">
            <form class="FormFilters" method="get" th:action="@{/produse}">
                <input type="hidden" name="categorie" th:if="${selectedCategorie != null}" th:value="${selectedCategorie}" />

                <h3 class="handcursor">Ordine</h3>
                <div class="InfoHolder">
                    <select name="sort" onchange="this.form.submit()">
                        <option value="rec_ral" th:selected="${filtru.sort == 'rec_ral'}">Recomandare RAL</option>
                        <option value="price_desc" th:selected="${filtru.sort == 'price_desc'}">Pret descrescator</option>
                        <option value="price_asc" th:selected="${filtru.sort == 'price_asc'}">Pret crescator</option>
                    </select>
                </div>
                <div class="Separator"></div>

                <h3 class="handcursor">Produs</h3>
                <div class="InfoHolder">
                    <input type="text" name="nume" th:value="${filtru.nameFilter}" style="width:100px;height:12px;margin-top:2px;" />
                    <input type="submit" value="cauta" />
                </div>
                <div class="Separator"></div>

                <h3 class="handcursor">Furnizor</h3>
                <div class="InfoHolder">
                    <select name="producator" onchange="this.form.submit()">
                        <option value="">Toti</option>
                        <option th:each="s : ${rezultat.suppliers}" th:value="${s.cod}"
                                th:text="|${s.cod} (${s.count})|"
                                th:selected="${filtru.producatorCod == s.cod}"></option>
                    </select>
                </div>
                <div class="Separator"></div>

                <h3 class="handcursor">Stoc</h3>
                <div class="InfoHolder">
                    <select name="disponibile" onchange="this.form.submit()">
                        <option value="false" th:selected="${!filtru.doarDisponibile}">Toate</option>
                        <option value="true" th:selected="${filtru.doarDisponibile}">Doar disponibile</option>
                    </select>
                </div>
                <div class="Separator"></div>

                <h3 class="handcursor">Pret (RON)</h3>
                <div class="InfoHolder">
                    <input type="text" name="pretMin" th:value="${filtru.pretMin}" class="Boxes" placeholder="min" />
                    <input type="text" name="pretMax" th:value="${filtru.pretMax}" class="Boxes" placeholder="max" />
                    <input type="submit" value="ok" />
                </div>
                <div class="Separator"></div>

                <th:block th:each="grup : ${rezultat.attributeGroups}">
                    <h3 class="handcursor" th:text="${grup.nume}"></h3>
                    <div class="InfoHolder">
                        <th:block th:each="v : ${grup.valori}">
                            <input type="checkbox" th:name="|attr_${grup.nume}|" th:value="${v.value}"
                                   th:checked="${v.checked}" onchange="this.form.submit()" />
                            <label th:text="${v.value}"></label>
                            <label style="padding-right:5px;color:#ff6d00;" th:text="|(${v.count})|"></label>
                            <br/>
                        </th:block>
                    </div>
                    <div class="Separator"></div>
                </th:block>

                <a th:href="@{/produse(categorie=${selectedCategorie})}">Sterge filtrele</a>
            </form>
        </td></tr>
    </table>
</div>

<div style="clear:both;">&nbsp;</div>

<div th:replace="~{fragments/chrome :: footer}"></div>

</body>
</html>
